<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <script src="https://kit.fontawesome.com/beb9c9acc8.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-100 h-screen">
    <section>
<!--Header-->
        <div class="bg-gradient-to-bl from-sky-100 to-pink-100 p-6 text-center shadow rounded-2xl">
           <h1 class="text-3xl font-bold text-pink-600">Habit Tracker</h1>
           <p class="text-gray-600 text-sm">Small habits, big glow-ups.</p>
        </div>
        
        <div class="bg-white p-6 rounded-lg border border-pink-400 mt-10 max-w-xl mx-auto shadow-md">
            <div class="flex justify-between gap-2">
                <i class="fa-solid fa-seedling text-pink-600 text-2xl"></i>
                <h1 class="font-bold text-pink-600 text-2xl">Habit Tracker</h1>
                <input id="habitInput" type="text" placeholder="Add new habit..." class="border p-3 rounded-lg flex-1 outline-pink-500">
                <button id="addHabitBtn" class="bg-pink-500 text-white font-black rounded-lg p-3 cursor-pointer hover:bg-pink-300">Add</button>
            </div>

            <!--Days-->
            <div class="grid grid-cols-8 text-center text-xs font-bold text-gray-500 mb-3 mt-4 mr-9">
                <div>Habit</div>
                <div>M</div>
                <div>T</div>
                <div>W</div>
                <div>Th</div>
                <div>F</div>
                <div>S</div>
                <div>S</div>

            </div>
            <div id="habitList" class="space-y-3"></div>

        </div>

    </section>
    <script src="folder.js/habit.js"></script>
</body>
</html>
