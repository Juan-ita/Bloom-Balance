<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/beb9c9acc8.js" crossorigin="anonymous"></script>
</head>
<body class="bg-pink-200/40">
    <section>

        <div class="absolute top-3 right-3 md:top-1 right-1 bg-white/30 rounded-full p-2 shadow-xl">
        <a href="dashboard.html">
            <i class="fa-solid fa-right-to-bracket text-3xl text-sky-400"></i><p class="font-bold">Leave</p>
        </a>
    </div>
        <div class="bg-white max-w-xl mx-auto p-6 mt-25 space-y-6 rounded-xl border border-pink-600 shadow-md">
            <!--Header-->
            <div class="text-pink-500 font-bold text-2xl flex">
                <i class="fa-solid fa-clipboard "></i>
                <h1>My Tasks</h1>
            </div>

            <div class="bg-pink-100 space-y-3 py-5 rounded-xl">
                <h1 class="flex justify-center text-pink-700 font-bold text-2xl">Total Tasks</h1>
                <p id="totalTasks" class="flex justify-center text-pink-500 font-bold text-4xl">0</p>
            </div>

            <div class="flex gap-2 mb-6">
             <input id="taskInput" type="text" placeholder="Add task.." class="flex-1 border rounded-lg p-2 outline-pink-500">
             <button id="Btn" class="bg-pink-600 text-white font-black rounded-xl cursor-pointer hover:bg-pink-400 px-4">Add task</button> 
            </div>

            <!--Task List-->
            <div>
                <div class="flex justify-between mb-2">
                <h2 class="font-bold">Tasks to be completed</h2>
                <button id="resetButton" class="text-red-400 hover:underline text-sm cursor-pointer">Clear all</button> 
                </div>

                <div id="taskList" class="space-y-3"></div>  
            </div>
        </div>
            
    
    </section>



<!-------------------------------Javascript--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
    <script>
const task_input = document.getElementById("taskInput")
const add_Btn = document.getElementById("Btn")
const task_list = document.getElementById("taskList")
const totalTasks = document.getElementById("totalTasks")
const reset_button = document.getElementById("resetButton")

//Load tasks from localStorage
const tasks = JSON.parse(localStorage.getItem("tasks")) || [];//Gets the saved tasks but if nothing exists creates an emptu array

 function saveTasks(){
       localStorage.setItem("tasks", JSON.stringify(tasks));
}


//Render tasks
function renderTasks(){
    task_list.innerHTML = ""; //Clears old task

    tasks.forEach((task, index) => {
        const list = document.createElement("li");//Creates html for each task
        list.innerHTML = `
        <div class="flex justify-between items-center p-3 border rounded-lg">
          <div class="flex items-center gap-2">
             <input type="checkbox" class="w-5 h-5 accent-pink-400">
             <span>${task.name}</span>
          </div>

             <button onclick="removeTask(${index})" class="text-red-600 cursor-pointer">Delete</button>
        </div>
        `
        task_list.appendChild(list)//Puts the new task list on the screen

        const checkbox = list.querySelector("input");
        checkbox.checked = task.done; //If the task is saved as done tick the box

        checkbox.onchange = function(){
            task.done = checkbox.checked;//Updates the task state
            saveTasks();
        };
        });

        //Add new task
        add_Btn.onclick = function(){
            if(task_input.value !== ""){
                const new_task = {
                    name: task_input.value,
                    done: false
                };

                tasks.push(new_task);//Add task into array
                saveTasks();

                //Refreshes the page
                renderTasks();
                task_input.value = "";//Clears the input box
                
                
            }
        }

        //Remove food items
        window.removeTask = function(position){
            tasks.splice(position, 1);//Removes one task
            saveTasks()
            renderTasks();
        }
        

         let currentTasks = 0;
        totalTasks.textContent = tasks.length// Shows the number of tasks
        totalTasks.textContent = currentTasks; 
        
    reset_button.onclick = function () {
    tasks.length = 0; //Deletes all tasks
    saveTasks();
    renderTasks();
};
    
}
renderTasks();
    </script>
    
</body>
</html>
