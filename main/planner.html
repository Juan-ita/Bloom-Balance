<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-indigo-100">
    <section>

        <div class="bg-gradient-to-br from-indigo-200/30 to-purple-200 p-5 rounded-4xl shadow-xl">
            <h1 class="font-bold text-2xl flex justify-center">Hello sunshine, Lets make today beautiful!</h1>

            <div>

            </div>

            <!--Options-->
            <div class="grid grid-cols-2">
                <a href="daily.html">
                <div class="bg-indigo-100 p-3 mt-4 rounded-xl border border-indigo-600 shadow-md">
                    <p class="font-black italic">Daily Planner.</p>
                </div>
                </a>

                <a href="weekly.html">
                    <div class="bg-indigo-100 p-3 mt-4 rounded-xl border border-indigo-600 shadow-md ml-5">
                        <p class="font-black italic">Weekly Planner.</p>
                    </div>
                </a>

                <a href="study.html">
                    <div class="bg-indigo-100 p-3 mt-4 rounded-xl border border-indigo-600 shadow-md">
                        <p class="font-black italic">Study planner</p>
                    </div>
                </a>

                <div class="bg-indigo-100 p-3 mt-4 rounded-xl border border-indigo-600 shadow-md ml-5 flex">
                   <i class="fa-solid fa-plus text-xl font-black"></i> <p  class="font-black italic text-purple-800">Add</p>
                </div>
                
            </div>
        </div>
    </section>
