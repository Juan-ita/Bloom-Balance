<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My journal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/beb9c9acc8.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gradient-to-br from-sky-300 to-pink-100 h-screen">
    <div class="p-6">
        <div id="entriesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <div class="absolute top-3 right-3 shadow-xl rounded-full">
        <a href="newJournal.html">
            <i class="fa-solid fa-plus text-3xl text-purple-700 bg-purple-100/40 rounded-full p-2"></i>
        </a>
    </div>

    <div class="absolute bottom-0 right-3 bg-white/30 rounded-full p-2 shadow-xl">
        <a href="dashboard.html">
            <i class="fa-solid fa-right-to-bracket text-3xl text-sky-400"></i><p class="font-bold">Leave</p>
        </a>
    </div>

  <!--Journal popUp-->
    <div id="journalModel" class="fixed inset-0 bg-black/50 hidden items-center justify-center">
       <div class="bg-white w-[700px] rounded-3xl p-8">
        <h1 class="text-3xl font-bold mb-4">Journal Entry</h1>

        <p id="fullJournal">Today was a good day.</p>

        <button id="closeBtn" class="bg-pink-500 text-white px-5 py-2 rounded-xl mt-6">Close</button>
       </div>
    </div>
   

    <script src="folder.js/journal.js"></script>

<!------------------------------------------------------JavaScript--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
    <script>
 const entriesContainer = document.getElementById("entriesContainer");

const journals = JSON.parse(localStorage.getItem("journals")) || []; //Gets the saved journals and if nothing exists create an empty array

 function deleteJournal(index){

    const answer = confirm("Are you sure you want to delete this journal entry?")

    if(answer){
             journals.splice(index, 1);//Remove one item from the array
            localStorage.setItem("journals", JSON.stringify(journals));//Stores the new array
            renderJournals();//Display the updated list
    }
           
        }

//Render journals
function renderJournals(){
    entriesContainer.innerHTML = "";//Removes everything currrently inside the container

    if(journals.length === 0){
        entriesContainer.innerHTML = `
        <p class="text-gray-600 text-lg">No journal entries yet.</p>
        `;
        return;// Ends the function immediately
    }
    journals.forEach((entry, index) =>{ //Goes through every challange
        const card = document.createElement("div");

        card.className = `
        bg-white border border-pink-400 p-6 rounded-xl h-80
         cursor-pointer hover:scale-105 transition duration-300 shadow-md
         overflow-hidden
        `;

        card.innerHTML = `
        <div class="flex justify-between">
                <h1 class="font-bold text-xl text-indigo-500">
                 ${entry.title || "Untitled"} 
                </h1>
                <p class="text-xs text-rose-400 font-bold">Edit</p>
            </div>

             
        
            <div class="bg-rose-100 border border-rose-300 rounded-xl p-4 mt-4 h-48 overflow-hidden">
                <p class="text-gray-700 line-clamp-6">
                    ${entry.text}
                </p>
            </div>

            <p class="text-xs text-gray-400 mt-3">
                ${entry.date}
            </p>

            <button onclick="deleteJournal (${index})" class="text-sm text-red-600 font-bold cursor-pointer">Delete</button>

            `;

            
        //Click opens popup
        card.addEventListener("click", ()=>{ //Runs the code when clicked
            openJournal(entry); //
        });
        entriesContainer.appendChild(card)//This adds the card to the page

       
    });
    
    
}
renderJournals();// Runs the function when the page opens
    </script>
</body>
</html>
