<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <script src="https://kit.fontawesome.com/beb9c9acc8.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <section>
        <!--Header-->
        <div class="bg-gradient-to-br from-green-100 to-purple-100 p-5 rounded-lg">
        <h1 class="text-4xl text-center font-bold">STUDY PLANNER</h1>
        </div>

        <!--Main-->
        <div class="grid grid-cols-2 md:grid-cols-1">
            <!--schedule-->
            <div class="border border-purple-500 space-y-3 rounded-lg p-3">
                <div class="bg-purple-300 text-center text-purple-700 font-black">
                    <h1>STUDY SCHEDULE</h1>
                </div>
                <div class="p-4 space-y-6">
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                    <p class="border-b border-gray-300"></p>
                </div>
                <table class="w-full border-collapse">
                    <tr>
                        <td class="border p-2">6:00 AM</td>
                        <td class="border p-2"></td>
                        <td class="border p-2"></td>
                    </tr>
                </table>
            </div>
        </div>
    </section>
    
</body>
</html>
