<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="">
    <section class="bg-pink-100 max-w-xl mx-auto mt-6 rounded-xl space-y-6 p-6">
        <h1 class="font-bold text-4xl bg-gradient-to-br from-indigo-400 to-pink-500 bg-clip-text text-transparent">Start planning today</h1> 
        <form id="user-form" class="space-y-6 text-">

            <label for="name">Full Name:</label>
            <input type="text" id="user-firstname" required placeholder="Enter your full name" class="rounded-lg border border-gray-800 px-3 p-4 w-full">

            <label for="username">Username</label>
            <input type="text" id="UserName" required placeholder="UserName" class="w-full rounded-lg border border-gray-800 px-3 p-4">

            <label for="email">Email</label>
            <input type="email" id="user-email" required placeholder=".......@gmail.com" class="w-full border border-gray-800 rounded-lg px-3 p-4">

            <label for="password">Password</label>
            <input type="password" id="user-password" required placeholder="********" class="w-full rounded-lg border border-gray-800 px-3 p-4">

            <label for="password">Confirm Password</label>
            <input type="password" id="confirm-password" required placeholder="********" class="w-full border border-gray-800 rounded-lg px-3 p-4">

            <label for="age">Age</label>
            <input type="number" id="user-age" required placeholder="Enter Your Age" class="w-full border border-gray-800 rounded-lg px-3 p-4">
            <button type="submit" class="bg-pink-500 w-full p-3 rounded-xl text-2xl text-white font-black hover:bg-pink-400 cursor-pointer">Start</button>

        </form>


    </section>
    <script src="sighnin.js"></script>


<!-----------------------------JavaScript------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------>
    <script>
const form = document.getElementById("user-form")
form.addEventListener("submit", function(event){ //Runs the code when the form is submitted
    event.preventDefault();//Prevents the page from reloading

 const firstName = document.getElementById("user-firstname").value;
 const user_name = document.getElementById("UserName").value;
 const email = document.getElementById("user-email").value;
 const password = document.getElementById("user-password").value;
 const ConfirmPassword = document.getElementById("confirm-password").value;
 const age = document.getElementById("user-age").value;



//password varification
if(password !== ConfirmPassword){
    alert("Password does not match")
    return;
}

// Age varification
if(age < 13){
    alert("You must be at least 13")
    return;
}

const userAccount = {
    firstName,  user_name, email, password, age
};

localStorage.setItem('userProfile', JSON.stringify(userAccount));

alert("Welcome to Bloom & Balance!")
 window.location.href = "login.html"
})
    </script>
</body>
</html>
